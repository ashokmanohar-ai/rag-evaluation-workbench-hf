name: Apply Regression Gate Integration

on:
  push:
    branches: [main]

concurrency:
  group: regression-gate-source-integration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Regression gate to SaaS navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('space-static/index.html')
          text = index.read_text(encoding='utf-8')
          nav = '<button class="side-link" data-target="benchmark"><span class="side-icon">⌁</span>Benchmark</button>'
          regression = '<a class="side-link" href="./regression.html"><span class="side-icon">Δ</span>Regression gate</a>'
          if regression not in text:
              if nav not in text:
                  raise SystemExit('Benchmark navigation marker not found')
              text = text.replace(nav, nav + '\n      ' + regression, 1)
              index.write_text(text, encoding='utf-8')
          PY
          grep -q 'Regression gate' space-static/index.html
          node --check space-static/regression.js

      - name: Commit navigation if changed
        run: |
          if git diff --quiet -- space-static/index.html; then
            echo "Regression navigation already integrated."
            exit 0
          fi
          git config user.name "Ashok Kumar Manohar"
          git config user.email "ashokmanohar.ai@gmail.com"
          git add space-static/index.html
          git commit -m "Expose regression gate in SaaS navigation"
          git push origin HEAD:main
