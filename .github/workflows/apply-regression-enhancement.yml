name: Apply Regression Gate Integration

on:
  push:
    branches: [main]

concurrency:
  group: huggingface-space-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch SaaS navigation and CI validation
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('space-static/index.html')
          text = index.read_text(encoding='utf-8')
          nav = '<button class="side-link" data-target="benchmark"><span class="side-icon">⌁</span>Benchmark</button>'
          regression = '<a class="side-link" href="./regression.html"><span class="side-icon">Δ</span>Regression gate</a>'
          if regression not in text:
              if nav not in text:
                  raise SystemExit('Benchmark navigation marker not found')
              text = text.replace(nav, nav + '\n      ' + regression, 1)
              index.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/deploy-huggingface.yml')
          wf = workflow.read_text(encoding='utf-8')
          check = '          node --check /tmp/space-check.mjs'
          extra = '          node --check space-static/regression.js\n          grep -q "id=\\\"baseline\\\"" space-static/regression.html\n          grep -q "id=\\\"candidate\\\"" space-static/regression.html'
          if 'node --check space-static/regression.js' not in wf:
              if check not in wf:
                  raise SystemExit('JavaScript validation marker not found')
              wf = wf.replace(check, check + '\n' + extra, 1)
              workflow.write_text(wf, encoding='utf-8')
          PY
          node --check space-static/regression.js
          grep -q 'Regression gate' space-static/index.html
          grep -q 'Run 3-way regression' space-static/regression.html

      - name: Commit integrated source
        run: |
          git config user.name "Ashok Kumar Manohar"
          git config user.email "ashokmanohar.ai@gmail.com"
          git add space-static/index.html .github/workflows/deploy-huggingface.yml
          git rm .github/workflows/apply-regression-enhancement.yml
          git commit -m "Integrate RAG regression gate into SaaS platform"
          git push origin HEAD:main

      - name: Publish synchronized static Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install -q --upgrade huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ['HF_TOKEN'])
          repo='ashokrulz20/rag-evaluation-workbench'
          api.create_repo(repo_id=repo, repo_type='space', space_sdk='static', private=False, exist_ok=True)
          api.upload_folder(repo_id=repo, repo_type='space', folder_path='space-static', commit_message='Deploy baseline vs candidate regression gate')
          print('Published https://huggingface.co/spaces/'+repo)
          PY
