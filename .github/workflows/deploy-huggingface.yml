name: Validate and Deploy Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: huggingface-space-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation and deployment dependencies
        run: python -m pip install --upgrade pip numpy huggingface_hub

      - name: Validate retrieval engine
        run: |
          python -m py_compile app.py rag_core.py test_core.py
          python test_core.py

      - name: Validate static Space JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("space-static/index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit("Static Space module script not found")
          Path("/tmp/space-check.mjs").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/space-check.mjs

      - name: Publish free static Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ashokrulz20/rag-evaluation-workbench
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise RuntimeError("GitHub Actions secret HF_TOKEN is missing.")

          repo_id = os.environ["HF_SPACE_ID"]
          api = HfApi(token=token)

          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="static",
              private=False,
              exist_ok=True,
          )

          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="space-static",
              commit_message=f"Deploy static Space from GitHub {os.environ.get('GITHUB_SHA', '')[:7]}",
          )

          print(f"Published: https://huggingface.co/spaces/{repo_id}")
          PY
